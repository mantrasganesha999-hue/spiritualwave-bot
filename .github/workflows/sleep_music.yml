name: SpiritualWave Sleep Music

on:
  workflow_dispatch:
  # Programacion desactivada (ahorra ~1,700 de cuota y evita videos de 8 h con 'hz'); solo manual

jobs:
  sleep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --break-system-packages requests pillow google-api-python-client google-auth-oauthlib google-auth-httplib2 python-dotenv
          sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Run sleep pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/pipeline_sleep.py
