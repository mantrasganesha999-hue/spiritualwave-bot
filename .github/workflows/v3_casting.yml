name: SpiritualWave Casting de Voces (v3)

on:
  push:
    branches: [master]
    paths: ['scripts/v3/casting_voces.py', '.github/workflows/v3_casting.yml']
  workflow_dispatch:

jobs:
  casting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts requests
      - name: Generar voces y mandarlas por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/v3/casting_voces.py
