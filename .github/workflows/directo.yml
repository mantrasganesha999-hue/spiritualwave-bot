name: SpiritualWave Directo

on:
  schedule:
    # 1 directo diario de ~4 horas: 14:30 UTC = 20:00 India / 09:30 Colombia
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      horas:
        description: 'Duracion del directo en horas (por defecto 4)'
        required: false
        default: ''
      forzar:
        description: 'Escribe 1 para saltarse el tope (1 directo por dia)'
        required: false
        default: ''

jobs:
  transmitir:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing ffmpeg fonts-dejavu
        pip install requests google-api-python-client google-auth-oauthlib Pillow

    - name: Transmitir en vivo
      env:
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DIRECTO_HORAS: ${{ github.event.inputs.horas }}
        FORZAR: ${{ github.event.inputs.forzar }}
      run: |
        python scripts/pipeline_directo.py
