name: SpiritualWave Auto Producer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --break-system-packages requests gtts pillow google-api-python-client google-auth-oauthlib google-auth-httplib2 python-dotenv
          sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/pipeline_cloud.py
