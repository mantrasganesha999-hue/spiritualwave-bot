name: SpiritualWave Auto Producer

on:
  workflow_dispatch:
    inputs:
      idioma:
        description: 'Idioma de esta ejecucion (en o hi). Vacio = automatico por hora'
        required: false
        default: ''
      forzar:
        description: 'Escribe 1 para saltarse el tope diario (1 largo + 1 short por idioma)'
        required: false
        default: ''
  schedule:
    # 14:00 UTC = hindi (19:30 India) | 22:00 UTC = ingles (18:00 Nueva York)
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --break-system-packages requests gtts pillow google-api-python-client google-auth-oauthlib google-auth-httplib2 python-dotenv
          sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_IDIOMA: ${{ github.event.inputs.idioma }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: python scripts/pipeline_cloud.py
